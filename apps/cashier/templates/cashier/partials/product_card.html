<button
  class="pos-product-card"
  type="button"
  hx-post="{% url 'cashier:cart_add' product.id %}"
  hx-target="#cart-panel"
  hx-swap="innerHTML"
>
  <div class="pos-product-media">
    {% if product.cashier_image_src %}
      <img
        class="pos-product-image"
        src="{{ product.cashier_image_src }}"
        alt="{{ product.name }}"
        loading="lazy"
      >
    {% else %}
      <div class="pos-product-image-fallback" aria-hidden="true">
        <span>{{ product.name|slice:":1"|upper }}</span>
      </div>
    {% endif %}
  </div>
  <div class="pos-product-name">{{ product.name }}</div>
  <div class="pos-product-meta">
    {% if product.requires_preparation %}
      <span class="pos-product-stock">Made to order</span>
    {% elif product.stock_qty is not None %}
      <span class="pos-product-stock">Stock {{ product.stock_qty }}</span>
    {% endif %}
    <span class="pos-product-price">{{ product.unit_price }} {{ currency }}</span>
  </div>
  {% if product.barcode %}
    <div class="pos-product-barcode">Barcode {{ product.barcode }}</div>
  {% endif %}
  <div class="pos-product-cta">
    <span>Add</span>
  </div>
</button>

{% if products %}
  <div class="pos-product-grid">
    {% for product in products %}
      {% include "cashier/partials/product_card.html" %}
    {% endfor %}
  </div>
{% else %}
  <div class="pos-empty">
    <div class="pos-empty-title">No products</div>
    <div class="pos-empty-subtitle">Add products or select another org.</div>
  </div>
{% endif %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Operations Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      :root {
        --bg: #f6f4ef;
        --card: #ffffff;
        --ink: #1a1a1a;
        --muted: #6f6f6f;
        --accent: #e46c3a;
        --line: #e6e0d8;
      }
      body {
        margin: 0;
        font-family: "Georgia", "Times New Roman", serif;
        background: radial-gradient(circle at 10% 10%, #fff6e8, #f6f4ef 45%, #efe7dc);
        color: var(--ink);
      }
      .wrap {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px 40px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        font-size: 32px;
        margin: 0;
        letter-spacing: 0.3px;
      }
      .org {
        color: var(--muted);
        font-size: 14px;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        margin-top: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--muted);
      }
      .metric {
        font-size: 28px;
        font-weight: bold;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .badge {
        display: inline-block;
        background: var(--accent);
        color: white;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .footer {
        margin-top: 24px;
        color: var(--muted);
        font-size: 12px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-top: 20px;
      }
      .tab {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--muted);
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        font-weight: 600;
      }
      .tab.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      .tab-panel {
        display: none;
        margin-top: 20px;
      }
      .tab-panel.active {
        display: block;
      }
      .filters {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
      }
      .filters input, .filters button {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      .filters button {
        background: var(--accent);
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Operations Dashboard</h1>
        <div class="org">Org: {{ org.name }}</div>
      </header>

      <div class="tabs">
        <button class="tab active" data-tab="ops">Operations</button>
        <button class="tab" data-tab="management">Management</button>
      </div>

      <div class="tab-panel active" id="tab-ops">
        <div
          id="dashboard-metrics"
          data-metrics-url="/dashboard/metrics/?org={{ org.public_id }}"
          hx-get="/dashboard/metrics/?org={{ org.public_id }}"
          hx-trigger="load, every 10s"
          hx-swap="outerHTML"
        >
          {% include "ops_dashboard/partials/metrics.html" %}
        </div>
      </div>

      <div class="tab-panel" id="tab-management">
        <form class="filters" method="get">
          <input type="hidden" name="org" value="{{ org.public_id }}">
          <label>Start: <input type="date" name="start" value="{{ start_date }}"></label>
          <label>End: <input type="date" name="end" value="{{ end_date }}"></label>
          <button type="submit">Apply</button>
        </form>
        <div class="grid">
          {% include "ops_dashboard/partials/management.html" %}
        </div>
      </div>

      <div class="footer">
        <span class="badge">Auto refresh</span> operations every 10 seconds
      </div>
    </div>
    <script>
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
          document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(`tab-${tab.dataset.tab}`).classList.add("active");
        });
      });

      // Fallback polling if htmx is blocked/unavailable.
      const refreshMetrics = () => {
        const root = document.getElementById("dashboard-metrics");
        if (!root) return;
        const url = root.dataset.metricsUrl;
        if (!url) return;
        fetch(url, { credentials: "same-origin" })
          .then((res) => (res.ok ? res.text() : null))
          .then((html) => {
            if (!html) return;
            root.outerHTML = html;
          })
          .catch(() => {});
      };

      if (!window.htmx) {
        setInterval(refreshMetrics, 10000);
      }
    </script>
  </body>
</html>

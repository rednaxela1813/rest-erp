<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Burger Ops - ERP System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #101418;
        --ink-soft: #4c5a66;
        --muted: #8b96a3;
        --accent: #ff6a3d;
        --accent-strong: #ff4f1a;
        --mint: #12c2a0;
        --surface: rgba(255, 255, 255, 0.9);
        --surface-strong: rgba(255, 255, 255, 0.97);
        --stroke: rgba(16, 20, 24, 0.08);
        --shadow: 0 24px 60px rgba(16, 20, 24, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 20%, #ffe9d7, transparent 55%),
          radial-gradient(circle at 90% 15%, #d7f4ff, transparent 50%),
          linear-gradient(120deg, #f6f4ef 0%, #eff6fb 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .welcome-container {
        background: var(--surface-strong);
        border-radius: 32px;
        padding: 3rem;
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: var(--shadow);
        text-align: center;
        max-width: 500px;
        width: 100%;
      }

      .welcome-title {
        font-size: clamp(2.2rem, 4vw, 3.2rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem 0;
      }

      .welcome-subtitle {
        color: var(--ink-soft);
        font-size: 1.1rem;
        margin: 0 0 3rem 0;
        line-height: 1.5;
      }

      .button-group {
        display: grid;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .welcome-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 1rem 2rem;
        border-radius: 16px;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
        gap: 0.5rem;
      }

      .welcome-btn-primary {
        background: var(--accent);
        color: white;
      }

      .welcome-btn-primary:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      .welcome-btn-secondary {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--stroke);
      }

      .welcome-btn-secondary:hover {
        background: white;
        transform: translateY(-1px);
        border-color: rgba(16, 20, 24, 0.12);
      }

      .welcome-footer {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 2rem;
        line-height: 1.4;
      }

      .welcome-footer a {
        color: var(--accent);
        text-decoration: none;
      }

      .welcome-footer a:hover {
        text-decoration: underline;
      }

      .welcome-icon {
        font-size: 1.2em;
        opacity: 0.8;
      }

      @media (max-width: 640px) {
        .welcome-container {
          padding: 2rem;
        }

        .welcome-btn {
          padding: 0.9rem 1.5rem;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="welcome-container">
      <h1 class="welcome-title">Burger Ops</h1>
      <p class="welcome-subtitle">
        Restaurant ERP & POS System<br>
        Choose your workspace to get started
      </p>
      
      <div class="button-group">
        <a href="/cashier/" class="welcome-btn welcome-btn-primary">
          <span class="welcome-icon">🍔</span>
          Cashier Terminal
        </a>
        <a href="/dashboard/" class="welcome-btn welcome-btn-secondary">
          <span class="welcome-icon">📊</span>
          Operations Dashboard
        </a>
      </div>

      <div class="welcome-footer">
        Need help? Check out the <a href="/admin/">admin panel</a> or
        <a href="/api/docs/">API documentation</a>
      </div>
    </div>
  </body>
</html>

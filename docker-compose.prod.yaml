name: rest-erp-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: rest-erp-prod-app:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10

  celery_worker:
    image: rest-erp-prod-app:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command: ["celery", "-A", "core", "worker", "-l", "info", "-Q", "device_commands,default"]

  celery_beat:
    image: rest-erp-prod-app:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: []
    command: ["celery", "-A", "core", "beat", "-l", "info"]

volumes:
  postgres_data_prod:
  redis_data_prod:
